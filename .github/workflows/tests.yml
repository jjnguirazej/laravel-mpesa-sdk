name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '11.*', testbench: '9.*', stability: prefer-lowest }
          - { php: '8.2', laravel: '11.*', testbench: '9.*', stability: prefer-stable }
          - { php: '8.3', laravel: '12.*', testbench: '10.*', stability: prefer-stable }
          - { php: '8.4', laravel: '12.*', testbench: '10.*', stability: prefer-stable }
          - { php: '8.3', laravel: '13.*', testbench: '11.*', stability: prefer-stable }
          - { php: '8.4', laravel: '13.*', testbench: '11.*', stability: prefer-stable }

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, json, curl
          coverage: none

      - name: Instalar dependências
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" "illuminate/contracts:${{ matrix.laravel }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Executar testes
        run: vendor/bin/phpunit
